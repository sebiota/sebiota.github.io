<html>

<head>
    <meta charset="utf-8">
    <title>Calculatrice</title>
</head>

<body>
    <form>
        <h1>Calculatrice</h1>

        <label for="txtNum1">Nombre 1: </label>
        <input type="text" id="txtNum1">
        <br><br>

        <label for="txtNum2">Nombre 2: </label>
        <input type="text" id="txtNum2">
        <br><br>

        <label for="operation">Choisissez l'opération:</label>
        <select id="operation">
            <option value="add">Addition</option>
            <option value="sub">Soustraction</option>
            <option value="mul">Multiplication</option>
            <option value="div">Division</option>
            <option value="mod">Modulo</option>
            <option value="exp">Exposant</option>
        </select>
        <br><br>

        <input type="button" value="Calculer" onclick="calculer()">
        <div id="divAffiche"></div>
    </form>

    <script>
        function calculer() {
            let num1 = parseFloat(document.getElementById("txtNum1").value);
            let num2 = parseFloat(document.getElementById("txtNum2").value);
            let operation = document.getElementById("operation").value;

            let result;
            let symbol;

            if (operation === "add") {
                result = num1 + num2;
                symbol = "+";
            } else if (operation === "sub") {
                result = num1 - num2;
                symbol = "-";
            } else if (operation === "mul") {
                result = num1 * num2;
                symbol = "*";
            } else if (operation === "div") {
                if (num2 !== 0) {
                    result = num1 / num2;
                    symbol = "/";
                } else {
                    result = "Erreur (division par 0)";
                    symbol = "/";
                }
            } else if (operation === "mod") {
                if (num2 !== 0) {
                    result = num1 % num2;
                    symbol = "%";
                } else {
                    result = "Erreur (division par 0)";
                    symbol = "%";
                }
            } else if (operation === "exp") {
                result = num1 ** num2;
                symbol = "^";
            } else {
                result = "Opération invalide";
                symbol = "?";
            }

            document.getElementById("divAffiche").innerHTML = `<br><br>${num1} ${symbol} ${num2} = ${result}`;
        }
    </script>

</body>

</html>
